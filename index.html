<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pavan Rao</title>
<style>
  :root {
    --paper: #EAECEE;
    --ink:   #16191C;
    --muted: #5C646B;
    --rule:  #C6CCD1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #101315;
      --ink:   #E2E6E9;
      --muted: #9AA3AA;
      --rule:  #2A3034;
    }
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.6 "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 2rem;
    box-sizing: border-box;
  }
  main { max-width: 34rem; }
  h1 {
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 0.75rem;
  }
  p { color: var(--muted); margin: 0 0 1rem; }
  a { color: var(--ink); text-underline-offset: 0.18em; }
  .rule { border: 0; border-top: 1px solid var(--rule); margin: 1.5rem 0; }
  .meta { font-size: 0.875rem; }
</style>
</head>
<body>
<main>
  <h1>Pavan Rao</h1>
  <p>Data engineering, and the tools I build while learning. A new site is going up here shortly.</p>
  <hr class="rule">
  <p class="meta">
    In the meantime: <a href="https://github.com/pavanrao">github.com/pavanrao</a>
  </p>
</main>
</body>
</html>
